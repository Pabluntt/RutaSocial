server {
    listen       8080;
    listen  [::]:8080;

    root /usr/share/nginx/html;

    # Railway temporal queda cubierto por https://*.railway.app; reemplazar por el dominio final del backend cuando exista.
    set $csp_connect_src "'self' http://localhost:8080 https://*.railway.app";
    set $csp "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http://www.google.com https://www.google.com https://www.google.cn https://maps.googleapis.com https://maps.gstatic.com https://*.tile.openstreetmap.org; connect-src $csp_connect_src; media-src 'self'; worker-src 'self'; child-src 'none'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'";

    location ~* \.js$ {
        add_header Content-Type application/javascript;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.css$ {
        add_header Content-Type text/css;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Assets cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - only for actual routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
